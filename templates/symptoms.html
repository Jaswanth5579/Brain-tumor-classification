<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Symptoms - {{ condition }}</title>
  <style>
    body { font-family: Arial; background: #fdfdfd; padding: 20px; }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 600px;
      margin: 20px auto;
      box-shadow: 0px 6px 15px rgba(0,0,0,0.1);
    }
    @media (max-width: 768px) {
      .card { margin: 10px; padding: 20px; }
    }
    h1 { color: #d32f2f; }
    ul { padding-left: 20px; }
    li { margin: 6px 0; }
    button {
      margin-top: 15px;
      padding: 10px 15px;
      background: #d32f2f;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #b71c1c; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚕️ Symptoms for {{ condition }}</h1>
    <ul>
      {% for symptom in symptoms %}
        <li>{{ symptom }}</li>
      {% endfor %}
    </ul>
    <button onclick="window.location.href='/'">⬅ Back to Home</button>
  </div>
</body>
</html>
